name: formsy
version: 0.1.0
type: context_engine
description: Formsy context engine for Hermes Agent

author: FormalAI
license: MIT

entry_point: plugins.context_engine.formsy:FormsyContextEngine

requirements:
  - httpx>=0.27.0
  - pydantic>=2.0.0

config_schema:
  type: object
  properties:
    base_url:
      type: string
      default: "https://api.formsy.ai"
    memory_search_endpoint:
      type: string
      default: "/api/v1/query"
    api_key_env:
      type: string
      default: "FORMSY_API_KEY"
    repo_id:
      type: string
      default: ""
    revision:
      type: string
      default: "latest"
    query_budget:
      type: integer
      default: 4000
    workspace_id:
      type: string
      default: "ws_default"
    tenant_id:
      type: string
    timeout_s:
      type: integer
      default: 30
    default_scene:
      type: string
      default: "auto"
